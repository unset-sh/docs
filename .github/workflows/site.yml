# Pages build and deploy are separate: only the deploy-pages invocation receives
# publication permissions. The source/cutover guards run before preparing an artifact.
# https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
# https://github.com/actions/upload-pages-artifact/blob/v5.0.0/action.yml
# https://github.com/actions/deploy-pages/blob/v5.0.1/action.yml
name: site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Poll published brand releases. GitHub schedules can be delayed; manual runs
  # use the same resolver. Only the default branch receives scheduled events.
  # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
  schedule:
    - cron: '23 * * * *'

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Resolve the latest compatible published brand release
        run: node scripts/update-brand.mjs
      - name: Refresh the organisation map from its source revision
        run: node scripts/update-map.mjs
      - name: Install pinned tooling without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify source and publication guards
        run: npm run check
      - name: Build the organisation site
        run: bash scripts/build.sh --publish
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
