# Pages build and deploy are separate: only the deploy-pages invocation receives
# publication permissions. The source/cutover guards run before preparing an artifact.
# https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
# https://github.com/actions/upload-pages-artifact/blob/v5.0.0/action.yml
# https://github.com/actions/deploy-pages/blob/v5.0.1/action.yml
name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  maps:
    if: github.ref == 'refs/heads/main'
    uses: unset-sh/tooling/.github/workflows/automation-maps-refresh.yml@d68963f9986cedd85d1274db6e461a5acac6599f
    permissions:
      contents: read
    with:
      registry: .github/maps.json
      install: true

  build:
    needs: maps
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Resolve the latest compatible published brand release
        # Avoid the anonymous API quota. This step sends the temporary read-only
        # token only to fixed GitHub API endpoints, never archives or site assets.
        # https://docs.github.com/en/rest/using-the-rest-api/rate-limits-for-the-rest-api
        env:
          DOCS_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-brand.mjs
      - name: Install pinned tooling without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Download validated maps from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.maps.outputs.artifact-name }}
          path: .
      - name: Verify source and publication guards
        run: npm run check
      - name: Build the organisation site
        run: bash scripts/build.sh --publish
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
