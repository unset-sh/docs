name: branch-policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

  workflow_dispatch:
    inputs:
      pull-request:
        description: Generated documentation pull request number
        type: string
        required: true
      expected-head:
        description: Exact generated documentation commit
        type: string
        required: true
      expected-base:
        description: Exact main commit reviewed by the receiver
        type: string
        required: true

permissions: {}

jobs:
  policy:
    permissions:
      contents: read
    uses: unset-sh/tooling/.github/workflows/ci-branch-policy.yml@9239c7b752a92fc1eb3de3a0e86193fce7c4bda3
    with:
      pull-request: ${{ inputs.pull-request || '' }}
      expected-head: ${{ inputs.expected-head || '' }}
      expected-base: ${{ inputs.expected-base || '' }}
      # docs has no staging branch (org-0010): every pull request targets main.
      flow: main
