# Reviewed stable source documentation is proposed to main as a pull request; a person merges it.
name: docs-import

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-import
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        source: [tooling, github]
    uses: unset-sh/tooling/.github/workflows/automation-docs-import.yml@dec0b577b416fd569951304af9ec00824edbd209
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      source: ${{ matrix.source }}
