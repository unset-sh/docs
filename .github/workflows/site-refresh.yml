# The default branch owns the timer; the reviewed dispatcher runs site.yml on main.
# https://docs.github.com/en/actions/concepts/security/github_token
name: site-refresh

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: site-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    uses: unset-sh/tooling/.github/workflows/automation-docs-map-schedule.yml@45975f0c7a9ef3d20a0cd2cba531288ac8bf2f90
    permissions:
      contents: read
      actions: write
